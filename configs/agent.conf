[agent]
node_id = node-1
manager_addr = 127.0.0.1:50051
interval_ms = 1000
# 网络采集模式: auto(tc→ebpf→proc) / tc / ebpf / proc
net_mode = auto
# eBPF kprobe 网络采集对象路径（需 root 运行）；留空或加载失败自动回退
bpf_object = build/bpf/net_monitor.bpf.o
# TC(clsact) 采集对象与网卡；tc_iface 留空则使用默认路由网卡（需 root）
tc_object = build/bpf/net_tc.bpf.o
tc_iface =
